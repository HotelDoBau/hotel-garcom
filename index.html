<script type="module" src="js/firebase.js"></script>
    
<script>

function abrirMesa(numero) {

    localStorage.setItem(
        "mesaSelecionada",
        numero
    );

    localStorage.setItem(
        "tipoSelecionado",
        "mesa"
    );

    window.location.href =
        "mesa.html";
}
    
    function abrirQuarto(numero) {

    localStorage.setItem(
        "mesaSelecionada",
        numero
    );

    localStorage.setItem(
        "tipoSelecionado",
        "quarto"
    );

    window.location.href =
        "mesa.html";

}


// =========================
// AGUARDAR FIREBASE
// =========================

async function aguardarFirebase() {

    let tentativas = 0;


    while (
        !window.firebaseHotel &&
        tentativas < 50
    ) {

        await new Promise(
            resolve =>
                setTimeout(resolve, 100)
        );

        tentativas++;

    }


    return !!window.firebaseHotel;

}


// =========================
// DEFINIR VISUAL DA MESA
// =========================

function definirStatusMesa(
    numeroMesa,
    status
) {

    const botao =
        document.querySelector(
            `.mesa:nth-child(${numeroMesa})`
        );


    if (!botao) {

        return;

    }


    const textoStatus =
        botao.querySelector("span");


    botao.classList.remove(
        "livre",
        "ocupada",
        "pagamento"
    );


    // PAGAMENTO

    if (status === "pagamento") {

        botao.classList.add(
            "pagamento"
        );

        textoStatus.textContent =
            "Pagamento";

        return;

    }


    // OCUPADA

    if (status === "ocupada") {

        botao.classList.add(
            "ocupada"
        );

        textoStatus.textContent =
            "Ocupada";

        return;

    }


    // LIVRE

    botao.classList.add(
        "livre"
    );

    textoStatus.textContent =
        "Livre";

}


// =========================
// INICIAR MESAS
// =========================

async function iniciarMesas() {

    const conectado =
        await aguardarFirebase();


    if (!conectado) {

        console.error(
            "Firebase não conectado."
        );

        return;

    }


    const {

        db,
        collection,
        onSnapshot

    } = window.firebaseHotel;


    // Primeiro deixa todas livres

    for (
        let numero = 1;
        numero <= 20;
        numero++
    ) {

        definirStatusMesa(
            numero,
            "livre"
        );

    }


    const referenciaMesas =
        collection(
            db,
            "mesas"
        );


    onSnapshot(

        referenciaMesas,

        snapshot => {


            // Sempre reinicia todas como livre

            for (
                let numero = 1;
                numero <= 20;
                numero++
            ) {

                definirStatusMesa(
                    numero,
                    "livre"
                );

            }


            // Aplica o que veio do Firebase

            snapshot.forEach(
                documento => {


                    const mesa =
                        documento.data();


                    const numeroMesa =
                        Number(
                            mesa.numero
                        );


                    if (
                        numeroMesa < 1 ||
                        numeroMesa > 20
                    ) {

                        return;

                    }


                    definirStatusMesa(

                        numeroMesa,

                        mesa.status ||
                        "livre"

                    );

                }
            );

        },


        erro => {

            console.error(
                "Erro ao carregar mesas:",
                erro
            );

        }

    );

}


// =========================
// INICIAR
// =========================

iniciarMesas();

</script>
