<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo Pedido - Hotel do Baú</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="topo">

    <h1 id="tituloMesa">
        Novo Pedido
    </h1>

    <p>
        Selecione os itens
    </p>

</header>


<main>

    <section class="busca-produtos">

        <input
            type="text"
            id="buscar"
            placeholder="🔍 Buscar produto"
        >

    </section>


    <section
        id="listaProdutos"
        class="lista-produtos">

        <!-- Produtos carregados pelo JavaScript -->

    </section>


    <section class="resumo-pedido">

        <div>
            <span>Itens</span>
            <strong id="qtdItens">0</strong>
        </div>

        <div>
            <span>Total</span>
            <strong id="totalPedido">
                R$ 0,00
            </strong>
        </div>

    </section>
    
<section class="quarto-pedido">

    <label for="numeroQuarto">
        🏨 Número do quarto
        <small>(opcional)</small>
    </label>

    <input
        type="text"
        id="numeroQuarto"
        inputmode="numeric"
        placeholder="Ex.: 10"
        autocomplete="off"
    >

</section>

    <section class="observacao-pedido">

        <label for="observacao">
            📝 Observação
        </label>

        <textarea
            id="observacao"
            placeholder="Ex.: sem cebola, ponto da carne..."
        ></textarea>

    </section>


       <section class="acoes-pedido">

        <button
            class="btn-pedido"
            onclick="abrirRevisao()">

            🧾 Revisar pedido

        </button>


        <button
            class="btn-voltar"
            onclick="voltarMesa()">

            ← Voltar para mesa

        </button>

    </section>


    <section
        id="modalRevisao"
        class="modal-revisao">

        <div class="caixa-revisao">

            <h2>
                🧾 Conferir pedido
            </h2>

            <div id="listaRevisao"></div>

            <div class="total-revisao">

                <span>Total</span>

                <strong id="totalRevisao">
                    R$ 0,00
                </strong>

            </div>

            <div class="acoes-revisao">

                <button
                    class="btn-voltar"
                    onclick="fecharRevisao()">

                    ← Continuar editando

                </button>


                <button
                    class="btn-pedido"
                    onclick="enviarPedido()">

                    ✅ OK - Enviar pedido

                </button>

            </div>

        </div>

    </section>

</main>
<script src="dados/produtos.js"></script>

<script type="module" src="js/firebase.js"></script>

<script src="js/pedido.js?v=8"></script>

</body>
</html>
