<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mesa - Hotel do Baú</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="topo">

    <h1 id="tituloMesa">Mesa</h1>

    <p>Comanda</p>

</header>


<main>

    <section class="resumo-mesa">

        <div class="linha-resumo">

            <span>Status</span>

            <strong id="statusMesa">
                Livre
            </strong>

        </div>


        <div class="linha-resumo">

            <span>Consumo atual</span>

            <strong id="valorMesa">
                R$ 0,00
            </strong>

        </div>

    </section>


    <section class="acoes-mesa">

        <button
            class="btn-pedido"
            onclick="novoPedido()">

            ➕ Novo pedido

        </button>


        <button
            class="btn-consumo"
            onclick="verConsumo()">

            🧾 Ver consumo

        </button>


        <button
            class="btn-fechar"
            onclick="fecharMesa()">

            💰 Fechar mesa

        </button>

    </section>


    <section
        class="consumo-mesa"
        id="consumoMesa">

        <h2>
            Consumo da mesa
        </h2>


        <div id="listaConsumo">

            <p class="mesa-vazia">
                Nenhum item lançado nesta mesa.
            </p>

        </div>

    </section>


    <button
        class="btn-voltar"
        onclick="voltarMesas()">

        ← Voltar para mesas

    </button>

</main>


<script>

const numeroMesa =
    localStorage.getItem("mesaSelecionada");


if (!numeroMesa) {

    window.location.href = "index.html";

}


document.getElementById("tituloMesa").textContent =
    "Mesa " + String(numeroMesa).padStart(2, "0");


// =========================
// CARREGAR DADOS DA MESA
// =========================

function carregarMesa() {

    const chaveMesa =
        "mesa_" + numeroMesa;


    const mesa = JSON.parse(
        localStorage.getItem(chaveMesa)
    );


    const statusMesa =
        document.getElementById("statusMesa");

    const valorMesa =
        document.getElementById("valorMesa");

    const listaConsumo =
        document.getElementById("listaConsumo");


    // MESA AINDA SEM PEDIDOS

    if (!mesa || !mesa.pedidos || mesa.pedidos.length === 0) {

        statusMesa.textContent = "Livre";

        statusMesa.style.color = "#268542";

        valorMesa.textContent = "R$ 0,00";

        listaConsumo.innerHTML = `
            <p class="mesa-vazia">
                Nenhum item lançado nesta mesa.
            </p>
        `;

        return;

    }


    // MESA OCUPADA

    statusMesa.textContent = "Ocupada";

    statusMesa.style.color = "#245d88";


    let totalMesa = 0;


    // Junta todos os itens dos pedidos

    const itensAcumulados = {};


    mesa.pedidos.forEach(pedido => {

        pedido.itens.forEach(item => {

            totalMesa +=
                Number(item.preco) *
                Number(item.quantidade);


            if (!itensAcumulados[item.id]) {

                itensAcumulados[item.id] = {

                    nome: item.nome,

                    preco: Number(item.preco),

                    quantidade: 0

                };

            }


            itensAcumulados[item.id].quantidade +=
                Number(item.quantidade);

        });

    });


    valorMesa.textContent =
        "R$ " + totalMesa.toFixed(2);


    listaConsumo.innerHTML = "";


    Object.values(itensAcumulados)
        .forEach(item => {

            const subtotal =
                item.preco * item.quantidade;


            const div =
                document.createElement("div");


            div.className =
                "item-consumo";


            div.innerHTML = `

                <div>

                    <strong>
                        ${item.quantidade}x
                        ${item.nome}
                    </strong>

                    <small>
                        R$ ${item.preco.toFixed(2)} cada
                    </small>

                </div>


                <strong>
                    R$ ${subtotal.toFixed(2)}
                </strong>

            `;


            listaConsumo.appendChild(div);

        });

}


// =========================
// NOVO PEDIDO
// =========================

function novoPedido() {

    window.location.href =
        "pedidos.html";

}


// =========================
// VER CONSUMO
// =========================

function verConsumo() {

    const consumo =
        document.getElementById("consumoMesa");

    consumo.classList.toggle("mostrar");

}


// =========================
// FECHAR MESA
// =========================

function fecharMesa() {

    const chaveMesa =
        "mesa_" + numeroMesa;


    const mesa = JSON.parse(
        localStorage.getItem(chaveMesa)
    );


    if (!mesa || !mesa.pedidos || mesa.pedidos.length === 0) {

        alert("Esta mesa não possui consumo.");

        return;

    }


    let totalMesa = 0;


    mesa.pedidos.forEach(pedido => {

        pedido.itens.forEach(item => {

            totalMesa +=
                Number(item.preco) *
                Number(item.quantidade);

        });

    });


    const confirmar = confirm(
        "Fechar Mesa " +
        String(numeroMesa).padStart(2, "0") +
        "?\n\nTotal: R$ " +
        totalMesa.toFixed(2)
    );


    if (!confirmar) {

        return;

    }


    alert(
        "Fechamento da mesa preparado.\n\n" +
        "Na próxima etapa vamos gerar a impressão da conta completa."
    );

}


// =========================
// VOLTAR
// =========================

function voltarMesas() {

    window.location.href =
        "index.html";

}


// =========================
// INICIAR
// =========================

carregarMesa();

</script>

</body>

</html>
