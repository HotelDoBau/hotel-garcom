<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mesa - Hotel do Baú</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="topo">

    <h1 id="tituloMesa">Mesa</h1>

    <p>Comanda</p>

</header>


<main>

    <section class="resumo-mesa">

        <div class="linha-resumo">

            <span>Status</span>

            <strong id="statusMesa">
                Livre
            </strong>

        </div>


        <div class="linha-resumo">

            <span>Consumo atual</span>

            <strong id="valorMesa">
                R$ 0,00
            </strong>

        </div>

    </section>


    <section class="acoes-mesa">

        <button
            class="btn-pedido"
            onclick="novoPedido()">

            ➕ Novo pedido

        </button>


        <button
            class="btn-consumo"
            onclick="verConsumo()">

            🧾 Ver consumo

        </button>


        <button
            class="btn-fechar"
            onclick="fecharMesa()">

            💰 Fechar mesa

        </button>

    </section>


    <section
        class="consumo-mesa"
        id="consumoMesa">

        <h2>
            Consumo da mesa
        </h2>


        <div id="listaConsumo">

            <p class="mesa-vazia">
                Nenhum item lançado nesta mesa.
            </p>

        </div>

    </section>


    <button
        class="btn-voltar"
        onclick="voltarMesas()">

        ← Voltar para mesas

    </button>

</main>

<script type="module" src="js/firebase.js?v=3"></script>
    
<script>

const numeroMesa =
    localStorage.getItem("mesaSelecionada");


if (!numeroMesa) {

    window.location.href = "index.html";

}


document.getElementById("tituloMesa").textContent =
    "Mesa " + String(numeroMesa).padStart(2, "0");


let pedidosMesa = [];


// =========================
// AGUARDAR FIREBASE
// =========================

async function aguardarFirebase() {

    let tentativas = 0;


    while (
        !window.firebaseHotel &&
        tentativas < 50
    ) {

        await new Promise(
            resolve => setTimeout(resolve, 100)
        );

        tentativas++;

    }


    return !!window.firebaseHotel;

}


// =========================
// MOSTRAR DADOS DA MESA
// =========================

function mostrarMesa() {

    const statusMesa =
        document.getElementById("statusMesa");

    const valorMesa =
        document.getElementById("valorMesa");

    const listaConsumo =
        document.getElementById("listaConsumo");


    if (pedidosMesa.length === 0) {

        statusMesa.textContent =
            "Livre";

        statusMesa.style.color =
            "#268542";

        valorMesa.textContent =
            "R$ 0,00";

        listaConsumo.innerHTML = `
            <p class="mesa-vazia">
                Nenhum item lançado nesta mesa.
            </p>
        `;

        return;

    }


    statusMesa.textContent =
        "Ocupada";

    statusMesa.style.color =
        "#245d88";


    let totalMesa = 0;

    const itensAcumulados = {};


    pedidosMesa.forEach(pedido => {

        const itens =
            Array.isArray(pedido.itens)
                ? pedido.itens
                : [];


        itens.forEach(item => {

            const preco =
                Number(item.preco || 0);

            const quantidade =
                Number(item.quantidade || 0);


            totalMesa +=
                preco * quantidade;


            const chave =
                String(item.id);


            if (!itensAcumulados[chave]) {

                itensAcumulados[chave] = {

                    nome:
                        item.nome,

                    preco:
                        preco,

                    quantidade:
                        0

                };

            }


            itensAcumulados[chave].quantidade +=
                quantidade;

        });

    });


    valorMesa.textContent =
        "R$ " +
        totalMesa.toFixed(2);


    listaConsumo.innerHTML = "";


    Object.values(itensAcumulados)
        .forEach(item => {

            const subtotal =
                item.preco *
                item.quantidade;


            const div =
                document.createElement("div");


            div.className =
                "item-consumo";


            div.innerHTML = `

                <div>

                    <strong>
                        ${item.quantidade}x
                        ${item.nome}
                    </strong>

                    <small>
                        R$ ${item.preco.toFixed(2)} cada
                    </small>

                </div>


                <strong>
                    R$ ${subtotal.toFixed(2)}
                </strong>

            `;


            listaConsumo.appendChild(div);

        });

}


// =========================
// ESCUTAR PEDIDOS DA MESA
// =========================

async function iniciarMesa() {

    const conectado =
        await aguardarFirebase();


    if (!conectado) {

        alert(
            "Não foi possível conectar ao Firebase."
        );

        return;

    }


    const {

        db,
        collection,
        onSnapshot

    } = window.firebaseHotel;


    const referenciaPedidos =
        collection(
            db,
            "mesas",
            "mesa_" +
            String(numeroMesa)
                .padStart(2, "0"),
            "pedidos"
        );


    onSnapshot(

        referenciaPedidos,

        snapshot => {

            pedidosMesa = [];


            snapshot.forEach(documento => {

                pedidosMesa.push({

                    id:
                        documento.id,

                    ...documento.data()

                });

            });


            mostrarMesa();

        },


        erro => {

            console.error(
                "Erro ao carregar mesa:",
                erro
            );


            alert(
                "Não foi possível carregar os pedidos desta mesa."
            );

        }

    );

}


// =========================
// NOVO PEDIDO
// =========================

function novoPedido() {

    window.location.href =
        "pedidos.html";

}


// =========================
// VER CONSUMO
// =========================

function verConsumo() {

    const consumo =
        document.getElementById(
            "consumoMesa"
        );


    consumo.classList.toggle(
        "mostrar"
    );

}


// =========================
// FECHAR MESA
// =========================

async function fecharMesa() {

    if (pedidosMesa.length === 0) {

        alert("Esta mesa não possui consumo.");

        return;

    }


    let totalMesa = 0;

    const itensAcumulados = {};


    // =========================
    // ACUMULAR TODOS OS PEDIDOS
    // =========================

    pedidosMesa.forEach(pedido => {

        const itens =
            Array.isArray(pedido.itens)
                ? pedido.itens
                : [];


        itens.forEach(item => {

            const preco =
                Number(item.preco || 0);

            const quantidade =
                Number(item.quantidade || 0);


            totalMesa +=
                preco * quantidade;


            const chave =
                String(item.id);


            if (!itensAcumulados[chave]) {

                itensAcumulados[chave] = {

                    nome:
                        item.nome,

                    preco:
                        preco,

                    quantidade:
                        0

                };

            }


            itensAcumulados[chave].quantidade +=
                quantidade;

        });

    });


    const confirmar = confirm(

        "Fechar Mesa " +
        String(numeroMesa).padStart(2, "0") +
        "?\n\n" +

        "Total: R$ " +
        totalMesa.toFixed(2)

    );


    if (!confirmar) {

        return;

    }


    // =========================
    // MONTA ITENS DA IMPRESSÃO
    // =========================

    let itensHTML = "";


    Object.values(itensAcumulados)
        .forEach(item => {

            const subtotal =
                item.preco *
                item.quantidade;


            itensHTML += `

                <div class="linha-item">

                    <span>

                        ${item.quantidade}x
                        ${item.nome}

                    </span>


                    <span>

                        R$ ${subtotal.toFixed(2)}

                    </span>

                </div>

            `;

        });


    // =========================
    // ABRIR IMPRESSÃO
    // =========================

    const janela =
        window.open(
            "",
            "_blank",
            "width=420,height=700"
        );


    if (!janela) {

        alert(
            "O navegador bloqueou a janela de impressão."
        );

        return;

    }


    janela.document.write(`

<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>
Fechamento Mesa ${numeroMesa}
</title>


<style>

@page {

    size: 80mm auto;

    margin: 3mm;

}


body {

    font-family:
        Arial,
        sans-serif;

    width: 72mm;

    margin: 0 auto;

    color: #000;

    font-size: 14px;

}


h1 {

    text-align: center;

    margin: 0;

    font-size: 20px;

}


h2 {

    text-align: center;

    margin: 5px 0;

    font-size: 18px;

}


.mesa {

    text-align: center;

    font-size: 26px;

    font-weight: bold;

    margin: 12px 0;

}


.separador {

    border-top:
        1px dashed #000;

    margin: 10px 0;

}


.linha-item {

    display: flex;

    justify-content:
        space-between;

    gap: 10px;

    margin: 10px 0;

}


.total {

    display: flex;

    justify-content:
        space-between;

    font-size: 20px;

    font-weight: bold;

    margin-top: 10px;

}


.central {

    text-align: center;

}

</style>

</head>


<body>


<h1>
HOTEL DO BAÚ
</h1>


<h2>
FECHAMENTO
</h2>


<div class="separador"></div>


<div class="mesa">

MESA
${String(numeroMesa).padStart(2, "0")}

</div>


<p class="central">

${new Date().toLocaleString("pt-BR")}

</p>


<div class="separador"></div>


${itensHTML}


<div class="separador"></div>


<div class="total">

    <span>
        TOTAL
    </span>

    <span>
        R$ ${totalMesa.toFixed(2)}
    </span>

</div>


<div class="separador"></div>


<p class="central">

Hotel do Baú

<br>

Obrigado!

</p>


</body>

</html>

    `);


    janela.document.close();


    // =========================
    // APÓS A IMPRESSÃO
    // =========================

    let posImpressaoExecutado = false;

    janela.onafterprint = async function () {

        if (posImpressaoExecutado) {
            return;
        }

        posImpressaoExecutado = true;

        const impressaoOk =
            confirm(
                "A conta da Mesa " +
                String(numeroMesa).padStart(2, "0") +
                " foi impressa corretamente?\n\n" +
                "OK = Finalizar mesa\n" +
                "CANCELAR = Manter mesa aberta"
            );

        if (!impressaoOk) {

            janela.close();
            return;

        }

        janela.close();

        await finalizarMesa();

    };


    // =========================
    // ABRE IMPRESSÃO
    // =========================

    setTimeout(
        function () {

            janela.focus();
            janela.print();

        },
        500
    );

}


// =========================
// FINALIZAR MESA
// =========================

async function finalizarMesa() {

    const conectado =
        await aguardarFirebase();


    if (!conectado) {

        alert(
            "Não foi possível conectar ao Firebase."
        );

        return;

    }


    try {

        const {

            db,
            collection,
            getDocs,
            deleteDoc,
            doc,
            setDoc,
            serverTimestamp

        } = window.firebaseHotel;


        const idMesa =
            "mesa_" +
            String(numeroMesa)
                .padStart(2, "0");


        // =========================
        // APAGA PEDIDOS DA MESA
        // =========================

        const referenciaPedidos =
            collection(
                db,
                "mesas",
                idMesa,
                "pedidos"
            );


        const snapshot =
            await getDocs(
                referenciaPedidos
            );


        const exclusoes = [];


        snapshot.forEach(
            documento => {

                exclusoes.push(

                    deleteDoc(
                        doc(
                            db,
                            "mesas",
                            idMesa,
                            "pedidos",
                            documento.id
                        )
                    )

                );

            }
        );


        await Promise.all(
            exclusoes
        );


        // =========================
        // DEIXA MESA LIVRE
        // =========================

        await setDoc(

            doc(
                db,
                "mesas",
                idMesa
            ),

            {
                numero: Number(numeroMesa),
                status: "livre",
                atualizadoEm: serverTimestamp()
            },

            {
                merge: true
            }

        );

        console.log(
            "Mesa marcada como livre:",
            idMesa
        );


        alert(
            "✅ Mesa " +
            String(numeroMesa)
                .padStart(2, "0") +
            " finalizada."
        );


        window.location.href =
            "index.html";

    }

    catch (erro) {

        console.error(
            "Erro ao finalizar mesa:",
            erro
        );


        alert(
            "❌ Não foi possível finalizar a mesa."
        );

    }

}


// =========================
// VOLTAR
// =========================

function voltarMesas() {

    window.location.href =
        "index.html";

}


// =========================
// INICIAR
// =========================

iniciarMesa();

</script>

</body>

</html>
